<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center min-h-screen items-center" style="font-family: 'Plus Jakarta Sans', sans-serif;">
  <main class="w-full max-w-md bg-[#FAF8F5] min-h-screen flex flex-col justify-between shadow-2xl px-6 py-4">
    
    <header class="flex justify-between items-center py-4 mb-4">
      <img src="../Imageds/DS LOGO HORIZONTAL.png" alt="DS Logo" class="h-8 w-auto object-contain">
      
      <div class="flex items-center gap-4">
        <a href="../cart.html" class="font-bold text-sm tracking-widest text-neutral-800 uppercase hover:opacity-06">
          bag
        </a>

        <a href="javascript:history.back()" class="hover:opacity-60">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-10 h-6 text-neutral-800"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 5.75L3 12m0 0l3.75-3.75M3 12h18"></svg>
        </a>
      </div>
    </header>

      <!-- Image Slider -->
      <div class="relative w-full aspect-[4/5] bg-neutral-200 overflow-hidden mb-6">
        <div id="imageSlider" class="flex w-full h-full overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth">
          <!-- Foto dari Supabase bakal masuk otomatis ke sini -->
        </div>

        <!-- Slider Dots Indicator -->
        <div id="sliderDots" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-2 z-10">
        </div>
      </div>

      <div class="mb-6">
        <h1 id="product-name" class="text-2xl text-neutral-900 mb-1">Memuat...</h1>
        <p id="product-price" class="text-sm tracking-widest text-neutral-500 uppercase">IDR 0</p>
      </div>
      <div class="mb-6 border-b border-neutral-600 pb-1">
        <select id="sizePicker" class="w-full bg-transparent text-xs tracking-widest uppercase outline-none cursor-pointer">
          <option value="" disabled selected>Pilih Ukuran</option>
          <option value="S">Size S</option>
          <option value="M">Size M</option>
          <option value="L">Size L</option>
          <option value="XL">Size XL</option>
        </select>
      </div>
      <button id="addToCartBtn" class="w-full border border-neutral-400 py-3 text-xs tracking-[0.2em] uppercase text-neutral-800 hover:bg-neutral-900 hover:text-white transition-all mb-8">
        Tambah ke Keranjang
      </button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/detail.js"></script>
</body>
</html>
