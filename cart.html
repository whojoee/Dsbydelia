<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <!-- Hubungkan ke file CSS utama lo di sini kalau ada -->
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        /* CSS dasar untuk layout Cart biar langsung rapi */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; color: #333; }
        .cart-container { max-width: 1100px; margin: 40px auto; padding: 20px; }
        .cart-header { font-size: 24px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        
        .cart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        
        /* Bagian Kiri: List Produk */
        .cart-item { display: flex; align-items: center; padding: 20px 0; border-bottom: 1px solid #eee; }
        .cart-item img { width: 120px; height: 150px; object-fit: cover; margin-right: 20px; }
        .item-details { flex-grow: 1; }
        .item-name { font-size: 18px; font-weight: 600; margin-bottom: 5px; }
        .item-price { color: #666; margin-bottom: 15px; }
        
        .qty-controls { display: flex; align-items: center; gap: 15px; }
        .qty-btn { width: 30px; height: 30px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 16px; }
        .qty-btn:hover { background: #f0f0f0; }
        .remove-btn { color: #d9534f; border: none; background: transparent; cursor: pointer; font-size: 14px; margin-top: 15px; text-decoration: underline; }
        
        .item-total { font-size: 18px; font-weight: bold; }

        /* Bagian Kanan: Ringkasan Order */
        .cart-summary { background: #fafafa; padding: 25px; border-radius: 8px; height: fit-content; border: 1px solid #eaeaea; }
        .summary-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; color: #555; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 20px; font-weight: bold; color: #000; }
        
        .checkout-btn { width: 100%; padding: 15px; background: #000; color: #fff; border: none; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .checkout-btn:hover { background: #333; }
        
        .empty-cart { text-align: center; padding: 50px; font-size: 18px; color: #777; grid-column: 1 / -1; }
        .empty-cart a { color: #000; font-weight: bold; text-decoration: none; }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            .cart-grid { grid-template-columns: 1fr; }
            .cart-item { flex-direction: column; align-items: flex-start; }
            .cart-item img { width: 100%; height: auto; margin-bottom: 15px; }
            .item-total { margin-top: 15px; }
        }
    </style>
</head>
<body>

    <!-- Placeholder Navbar Sederhana (sesuaikan dengan navbar asli lo) -->
    

    <div class="cart-container">
        <div class="cart-header">Shopping Cart</div>
        
        <div class="cart-grid">
            <!-- Bagian Kiri: List Item Keranjang -->
            <div id="cart-items-container">
                <!-- Data produk akan di-inject lewat Javascript di sini -->
            </div>

            <!-- Bagian Kanan: Ringkasan Harga -->
            <div class="cart-summary">
                <div class="summary-title">Order Summary</div>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">IDR 0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Calculated at checkout</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="cart-total">IDR 0</span>
                </div>
                <button class="checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <!-- Script Midtrans Snap (Sandbox) -->
<script type="text/javascript"
  src="https://app.sandbox.midtrans.com/snap/snap.js"
  data-client-key="Mid-client-a22ojL9CD4CSyQMM">
</script>

    <!-- Panggil file logic cart.js -->
     <script src="js/cart.js"></script>
    <link rel="stylesheet" href="css/global.css">
</body>
</html>
