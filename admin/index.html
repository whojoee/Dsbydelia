<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - DS by Delia Septianti</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="../Imageds/DS LOGO HORIZONTAL.png" alt="DS by Delia Septianti" class="h-10 w-auto object-contain">
                <span class="text-xl font-bold text-gray-700 hidden sm:block border-l-2 pl-4 border-gray-300">Admin</span>
            </div>
            <div>
                <a href="../index.html" class="text-sm font-medium text-gray-500 hover:text-black transition flex items-center gap-1">
                    &larr; Balik ke Toko
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 sm:p-8 max-w-7xl mx-auto">
        
        <!-- Judul & Filter -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Pesanan Masuk</h1>
                <p class="text-sm text-gray-500 mt-1">Data otomatis masuk saat pembeli checkout via WhatsApp</p>
            </div>

            <div class="flex space-x-3">
                <select id="status-filter" class="border border-gray-300 rounded-md px-3 py-2 text-sm font-medium text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-black">
                    <option value="all">Semua Pesanan</option>
                    <option value="pending">Pending (Belum Bayar)</option>
                    <option value="paid">Lunas</option>
                    <option value="cancel">Dibatalkan</option>
                </select>

                <button id="refresh-btn" class="bg-black text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-800 transition shadow-sm">
                    Refresh
                </button>
            </div>
        </div>

        <!-- Statistik Ringkas -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <p class="text-xs font-medium text-gray-500 uppercase">Omzet Lunas Bulan Ini</p>
                <p id="stat-revenue" class="text-2xl font-bold text-gray-800 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <p class="text-xs font-medium text-gray-500 uppercase">Menunggu Pembayaran</p>
                <p id="stat-pending" class="text-2xl font-bold text-yellow-600 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <p class="text-xs font-medium text-gray-500 uppercase">Pesanan Lunas</p>
                <p id="stat-success" class="text-2xl font-bold text-green-600 mt-1">0</p>
            </div>
        </div>

        <!-- Tabel Pesanan -->
        <div class="bg-white overflow-x-auto shadow-sm border border-gray-200 rounded-lg">
            <table class="min-w-full text-left text-sm whitespace-nowrap">
                <thead class="border-b bg-gray-50 font-semibold text-gray-700">
                    <tr>
                        <th scope="col" class="px-6 py-4">Order ID & Waktu</th>
                        <th scope="col" class="px-6 py-4">Pembeli</th>
                        <th scope="col" class="px-6 py-4">Total</th>
                        <th scope="col" class="px-6 py-4">Status</th>
                        <th scope="col" class="px-6 py-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="order-table-body" class="divide-y divide-gray-100">
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                            Memuat data pesanan...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Form Tambah Produk -->
        <div class="bg-white p-6 shadow-sm border border-gray-200 rounded-lg mt-10">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Tambah Produk Baru</h2>
            <form id="addProductForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="productName" class="block text-sm font-medium text-gray-700 mb-1">Nama Produk</label>
                        <input type="text" id="productName" required placeholder="Contoh: Kemeja Flanel" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                    <div>
                        <label for="productPrice" class="block text-sm font-medium text-gray-700 mb-1">Harga (Angka saja)</label>
                        <input type="number" id="productPrice" required placeholder="Contoh: 150000" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                    <div>
                        <label for="productCategory" class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                        <select id="productCategory" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black">
                            <option value="all_product">All Product</option>
                            <option value="best_seller">Best Seller</option>
                        </select>
                    </div>
                    <div>
                        <label for="productImageFiles" class="block text-sm font-medium text-gray-700 mb-1">Upload Foto Produk (Maks. 3 Foto)</label>
                        <input type="file" id="productImageFiles" accept="image/*" multiple required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm bg-white file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-black file:text-white hover:file:bg-gray-800">
                    </div>
                </div>
                <div class="flex justify-end mt-4">
                    <button type="submit" id="submitProductBtn" class="bg-black text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-800 transition">
                        Tambah Produk
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Daftar Produk -->
        <div class="mt-10 mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Daftar Produk</h2>
            <div class="bg-white overflow-x-auto shadow-sm border border-gray-200 rounded-lg">
                <table class="min-w-full text-left text-sm whitespace-nowrap">
                    <thead class="border-b bg-gray-50 font-semibold text-gray-700">
                        <tr>
                            <th scope="col" class="px-6 py-4">Foto</th>
                            <th scope="col" class="px-6 py-4">Nama Produk</th>
                            <th scope="col" class="px-6 py
