<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Toko Lu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
            <p class="text-gray-500 text-sm mt-1">Silakan login untuk melanjutkan</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="text" id="username" class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-black focus:ring-1 focus:ring-black" required>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-black focus:ring-1 focus:ring-black" required>
            </div>

            <div id="error-message" class="text-red-500 text-xs hidden">
                Username atau password salah!
            </div>

            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-black hover:bg-gray-800 focus:outline-none transition">
                Masuk
            </button>
        </form>
    </div>

    <!-- Script sementara untuk nangani form submit -->
    <!-- Script Logic Login dengan Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Ganti dengan URL dan Anon Key Supabase lu!
        const supabaseUrl = 'https://krnaolsztrnesmymbmmu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtybmFvbHN6dHJuZXNteW1ibW11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyOTk0NDMsImV4cCI6MjA5OTg3NTQ0M30.ddZAXArx9A97-nhxw9d7_Xwur3jBq_jhquZEvti-AP8'; 
        const supabase = createClient(supabaseUrl, supabaseKey);

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            // Ubah ID input username di HTML lu dari type="text" id="username" menjadi email kalau perlu, 
            // tapi kita anggap aja input 'username' ini diisi pakai Email yang didaftarin di Supabase
            const email = document.getElementById('username').value; 
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.querySelector('button[type="submit"]');

            // Bikin tombol loading biar keliatan interaktif
            submitBtn.textContent = 'Mengecek...';
            submitBtn.disabled = true;
            errorMsg.classList.add('hidden');

            // Proses login ke Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                // Kalau salah email/password
                errorMsg.textContent = 'Email atau Password salah bro!';
                errorMsg.classList.remove('hidden');
                submitBtn.textContent = 'Masuk';
                submitBtn.disabled = false;
            } else {
                // Kalau sukses, lempar ke halaman admin
                window.location.href = 'index.html';
            }
        });
    </script>

</body>
</html>
